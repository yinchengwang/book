# GitHub Actions CI/CD 工作流
# 双轨独立 CI (S12)：工程层 + 学习层 各自独立 build & test
#
# Checkout 策略（2026-10-22 修复）：
#   仓库共 99 个子模块，其中 95 个是 reference/ 下的第三方源码参考仓（faiss/redis/
#   postgres/clickhouse/...），对构建毫无用处；submodules: recursive 会把它们全部
#   拉下来，导致 Checkout 步骤超时/失败，后续构建测试全被跳过。
#   真正被 CMake 引入的只有 vendor/third_part/googletest 一个：
#     - engine/CMakeLists.txt  add_subdirectory(../vendor/third_part/googletest)
#       （缺失时回退 find_package(GTest REQUIRED)，CI 环境无系统 GTest 会直接失败）
#   因此改为 submodules: false（默认值，此处显式声明以表意）+ 显式单模块浅拉取。
#
#   ⚠️ 构建实际依赖的子模块清单（2026-10-22 QA 验收后补全，缺一个就编译失败）：
#     - vendor/third_part/googletest —— engine/CMakeLists.txt 的 add_subdirectory
#     - engine/third_part/uthash     —— 5 处 CMakeLists 把头文件路径写死指向该子模块：
#                                       src/db/storage/graph、sparse、ts、
#                                       test/db/graph、src/db/api。
#                                       该路径下是 uthash 源码头文件的唯一实体位置，
#                                       必须拉子模块。
#
#   LFS 关闭：.gitattributes 追踪的 *.pdf / dataset/** / *.chm 全部不被任何构建或
#   测试步骤读取（sift_recall.c 等硬编码 Windows 路径且未注册进 ctest），约 692MB
#   的 LFS 内容对 CI 毫无价值。
#
#   fetch-depth 保持默认(1)：工作流内没有任何 git log / git describe / git tag 取版本号。

name: CI

on:
  push:
    branches: [main, project]
  pull_request:
    branches: [main, project]

env:
  BUILD_TYPE: Release

jobs:
  # ============ 工程层（PG 风格数据库 + MiniVecDB）============

  build-engineering-ubuntu:
    name: Build Engineering (Ubuntu/GCC)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        persist-credentials: false

    - name: Fetch googletest submodule
      run: git submodule update --init --depth 1 vendor/third_part/googletest engine/third_part/uthash

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake (Engineering)
      run: |
        cmake -B build/engine -S engine \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTING=ON

    - name: Build (Engineering)
      run: |
        cmake --build build/engine --parallel 4

  test-engineering-ubuntu:
    name: Test Engineering (Ubuntu/GCC)
    runs-on: ubuntu-22.04
    needs: build-engineering-ubuntu

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        persist-credentials: false

    - name: Fetch googletest submodule
      run: git submodule update --init --depth 1 vendor/third_part/googletest engine/third_part/uthash

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure & Build (Engineering)
      run: |
        cmake -B build/engine -S engine \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTING=ON
        cmake --build build/engine --parallel 4

    - name: Run ctest (Engineering)
      working-directory: ./build/engine
      run: |
        ctest --output-on-failure -j4

  build-engineering-windows:
    name: Build Engineering (Windows/MinGW)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        persist-credentials: false

    - name: Fetch googletest submodule
      run: git submodule update --init --depth 1 vendor/third_part/googletest engine/third_part/uthash

    - name: Set up MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make

    - name: Configure CMake (Engineering/Windows)
      shell: msys2 {0}
      run: |
        cmake -B build/engine -S engine \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTING=ON \
          -G "MinGW Makefiles"

    - name: Build (Engineering/Windows)
      shell: msys2 {0}
      run: |
        cmake --build build/engine --parallel 4

  # ============ 学习层（ds/algo/quiz）============

  coverage-ubuntu:
    name: Coverage (Ubuntu/GCC+lcov)
    runs-on: ubuntu-22.04
    needs: build-engineering-ubuntu

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        persist-credentials: false

    - name: Fetch googletest submodule
      run: git submodule update --init --depth 1 vendor/third_part/googletest engine/third_part/uthash

    - name: Install lcov + PyYAML
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential lcov
        python3 -m pip install --break-system-packages pyyaml || pip install pyyaml

    - name: Configure Engineering with Coverage
      working-directory: ./engine
      run: |
        rm -rf build-cov
        cmake -B build-cov -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON \
          -DBUILD_TESTING=ON

    - name: Build (coverage flags)
      working-directory: ./engine
      run: cmake --build build-cov --parallel 4

    - name: Run ctest (收集 .gcda)
      working-directory: ./engine/build-cov
      run: ctest --output-on-failure -j4 || true

    - name: Run coverage scripts
      working-directory: ./engine
      run: |
        bash scripts/coverage/run.sh || true
        if [ -f coverage.info.filtered ]; then
          python3 scripts/coverage/aggregate.py coverage.info.filtered > coverage-current.json || true
          python3 scripts/coverage/compare.py coverage-current.json docs/coverage-baseline.json > coverage-diff.md || true
          python3 scripts/coverage/badge.py coverage-current.json coverage-badge.svg || true
        fi

    - name: Show coverage diff
      working-directory: ./engine
      run: |
        if [ -f coverage-diff.md ]; then
          cat coverage-diff.md
        fi

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          engine/coverage-html/
          engine/coverage.info
          engine/coverage.info.filtered
          engine/coverage-current.json
          engine/coverage-diff.md
          engine/coverage-badge.svg