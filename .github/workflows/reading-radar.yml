name: Build & Test
on:
  push:
    branches: [main]
    paths:
      - 'engineering/apps/web/reading-radar/**'
      - 'engineering/apps/games/web/shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'engineering/apps/web/reading-radar/**'
      - 'engineering/apps/games/web/shared/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: engineering/apps/web/reading-radar/package-lock.json
      - run: npm ci
        working-directory: engineering/apps/web/reading-radar
      - run: npm test -- --run
        working-directory: engineering/apps/web/reading-radar
      - run: npm run build
        working-directory: engineering/apps/web/reading-radar
